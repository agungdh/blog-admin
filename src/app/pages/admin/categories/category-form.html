@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<div class="form-header">
  <h2>{{ isEdit() ? 'Edit Category' : 'New Category' }}</h2>
  <a mat-stroked-button routerLink="/admin/categories">
    <mat-icon>arrow_back</mat-icon> Back
  </a>
</div>

@if (!loading()) {
  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        @if (submitting()) {
          <mat-progress-bar mode="indeterminate" class="submit-bar" />
        }

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" (input)="generateSlug()" />
          @if (errors()['name']) {
            <mat-error>{{ fieldError('name') }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Slug</mat-label>
          <input matInput formControlName="slug" />
          @if (errors()['slug']) {
            <mat-error>{{ fieldError('slug') }}</mat-error>
          }
        </mat-form-field>

        <div class="form-actions">
          <button mat-flat-button type="submit" [disabled]="submitting()">
            {{ isEdit() ? 'Update' : 'Create' }}
          </button>
          <a mat-button routerLink="/admin/categories">Cancel</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
}
