<div class="page-header">
  <h2>Categories</h2>
  <a mat-flat-button routerLink="/admin/categories/new">
    <mat-icon>add</mat-icon> Add Category
  </a>
</div>

@if (loading() && categories().length === 0) {
  <mat-progress-bar mode="indeterminate" />
}

<table mat-table [dataSource]="categories()" class="crud-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let cat">{{ cat.name }}</td>
  </ng-container>

  <ng-container matColumnDef="slug">
    <th mat-header-cell *matHeaderCellDef>Slug</th>
    <td mat-cell *matCellDef="let cat"><code>{{ cat.slug }}</code></td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let cat" class="actions-cell">
      <a mat-icon-button [routerLink]="['/admin/categories', cat.id]" matTooltip="Edit">
        <mat-icon>edit</mat-icon>
      </a>
      <button mat-icon-button color="warn" matTooltip="Delete" (click)="delete(cat.id, cat.name)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

<div #sentinel class="sentinel"></div>

@if (loading() && categories().length > 0) {
  <div class="spinner">
    <mat-progress-bar mode="indeterminate" />
  </div>
}

@if (!loading() && !hasNext() && categories().length > 0) {
  <div class="end-text">All categories loaded</div>
}
