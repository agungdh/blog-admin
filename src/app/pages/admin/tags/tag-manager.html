<div class="page-header">
  <h2>Tags</h2>
  <a mat-flat-button routerLink="/admin/tags/new">
    <mat-icon>add</mat-icon> Add Tag
  </a>
</div>

@if (loading() && tags().length === 0) {
  <mat-progress-bar mode="indeterminate" />
}

<table mat-table [dataSource]="tags()" class="crud-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let tag">{{ tag.name }}</td>
  </ng-container>

  <ng-container matColumnDef="slug">
    <th mat-header-cell *matHeaderCellDef>Slug</th>
    <td mat-cell *matCellDef="let tag"><code>{{ tag.slug }}</code></td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let tag" class="actions-cell">
      <a mat-icon-button [routerLink]="['/admin/tags', tag.id]" matTooltip="Edit">
        <mat-icon>edit</mat-icon>
      </a>
      <button mat-icon-button color="warn" matTooltip="Delete" (click)="delete(tag.id, tag.name)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>

<div #sentinel class="sentinel"></div>

@if (loading() && tags().length > 0) {
  <div class="spinner">
    <mat-progress-bar mode="indeterminate" />
  </div>
}

@if (!loading() && !hasNext() && tags().length > 0) {
  <div class="end-text">All tags loaded</div>
}
